<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – TokoQu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-bg">
    <div class="auth-container">

      <!-- Header Logo -->
      <div class="auth-header">
        <div class="logo">Toko<span>Qu</span></div>
        <p>Belanja Mudah, Hemat &amp; Terpercaya</p>
      </div>

      <!-- Form Login -->
      <div class="auth-body">
        <h2>Masuk ke Akun Kamu</h2>

        <form action="index.html" method="get">

          <div class="form-group">
            <label for="email">Email / No. HP</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Contoh: budi@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password kamu"
              required
            />
          </div>

          <!-- Lupa Password -->
          <div style="text-align:right; margin-bottom:10px;">
            <a href="#" style="font-size:0.82rem; color:var(--primary); font-weight:600;">Lupa Password?</a>
          </div>

          <button type="submit" class="btn-primary">Masuk</button>

        </form>

        <!-- Divider -->
        <div style="display:flex; align-items:center; gap:10px; margin:18px 0;">
          <div style="flex:1; height:1px; background:var(--border);"></div>
          <span style="font-size:0.8rem; color:var(--text-light);">atau</span>
          <div style="flex:1; height:1px; background:var(--border);"></div>
        </div>

        <!-- Login dengan Google (dekoratif) -->
        <button class="btn-primary" style="background:var(--white); color:var(--text); border:1.5px solid var(--border); font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; margin-top:0;">
          <span style="font-size:1.2rem;">🌐</span> Masuk dengan Google
        </button>

        <div class="auth-footer">
          Belum punya akun? <a href="register.html">Daftar Sekarang</a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
